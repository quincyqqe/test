<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NVIDIA NIM Telegram Bot</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101418;
        color: #f5f7fa;
      }

      main {
        width: min(640px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 7vw, 64px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #aeb7c2;
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Telegram bot is online</h1>
      <p>Webhook endpoint: <code>/api/telegram</code></p>
    </main>
  </body>
</html>
